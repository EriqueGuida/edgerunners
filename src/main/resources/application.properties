spring.application.name=edgerunners

# Configuração do Banco de Dados MySQL (suporta variáveis de ambiente com fallback local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edgerunner_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração de JWT (Chave secreta em Base64 com >= 256 bits para HMAC-SHA256)
# Em perfis de produção/staging (ex: SPRING_PROFILES_ACTIVE=prod), JWT_SECRET deve ser fornecida explicitamente.
jwt.secret=${JWT_SECRET:NDI2MTY1NjQ2NzY1NzI3NTZlNmU2NTcyM2E0ZTY5NjY2ODc0NDI2MTY0NDM3OTYyNjU3MjIwNzc=}
# Tempo de expiração em milissegundos (86400000 ms = 24 horas)
jwt.expiration=${JWT_EXPIRATION:86400000}

# Inicialização de dados de desenvolvimento (desative com AFTERHOURS_SEED_DEMO_ACCOUNTS=false fora de dev)
afterhours.seed.demo-accounts=${AFTERHOURS_SEED_DEMO_ACCOUNTS:true}
afterhours.seed.admin-password=${AFTERHOURS_ADMIN_PASSWORD:admin123}
afterhours.seed.operator-password=${AFTERHOURS_OPERATOR_PASSWORD:afterhours}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
